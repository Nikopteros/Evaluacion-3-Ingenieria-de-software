{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Iniciar sesión</h1>
        {% if form.errors %}
          <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input class="form-control" type="text" name="username" id="id_username"
                   value="{{ form.username.value|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-rio w-100">Entrar</button>
        </form>
        <p class="mt-3 mb-0 small text-center">
          ¿No tienes cuenta? <a href="{% url 'hotel:registro' %}">Regístrate</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
