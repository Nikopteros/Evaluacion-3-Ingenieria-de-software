{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-{{ color }}">
      <div class="card-body p-4">
        <h1 class="h4">{{ titulo }}</h1>
        <p class="text-muted">{{ descripcion }}</p>
        {% include 'hotel/_reserva_resumen.html' %}
        <form method="post" class="d-flex gap-2 mt-4">
          {% csrf_token %}
          <button class="btn btn-{{ color }}">{{ titulo }}</button>
          <a class="btn btn-outline-secondary" href="{{ volver_url }}">Volver</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
