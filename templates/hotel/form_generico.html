{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">{{ titulo }}</h1>
        {% if subtitulo %}<p class="text-muted mb-3">{{ subtitulo }}</p>{% endif %}
        {% if enlace_extra %}<p class="mb-3"><a href="{{ enlace_extra.0 }}">{{ enlace_extra.1 }}</a></p>{% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          {% include 'hotel/_form.html' %}
          <div class="d-flex gap-2">
            <button class="btn btn-rio">Guardar</button>
            <a class="btn btn-outline-secondary" href="{{ volver_url }}">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
